<div class="container">
  <div class="card form-card">
    <h1>{{ title }}</h1>
    
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="initialValue">Valor Inicial (R$)</label>
        <input 
          type="number" 
          id="initialValue" 
          formControlName="initialValue" 
          placeholder="Ex: 1000.00"
          step="0.01">
        <div class="error" *ngIf="form.get('initialValue')?.invalid && form.get('initialValue')?.touched">
          Insira um valor maior que zero.
        </div>
      </div>

      <div class="form-group">
        <label for="months">Prazo de Resgate (Meses)</label>
        <input 
          type="number" 
          id="months" 
          formControlName="months" 
          placeholder="Ex: 12">
        <div class="error" *ngIf="form.get('months')?.invalid && form.get('months')?.touched">
          Insira um prazo maior que 1 mês.
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn-secondary" (click)="reset()">Limpar</button>
        <button type="submit" class="btn-primary" [disabled]="form.invalid">Calcular</button>
      </div>

      <div class="server-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
    </form>
  </div>

  <div class="card result-card" *ngIf="result">
    <h2>Resultado do Investimento</h2>
    
    <div class="result-details">
      <div class="detail-item">
        <span class="label">Valor Bruto:</span>
        <span class="value success">{{ result.grossValue | currency:'BRL':'symbol':'1.2-2' }}</span>
      </div>
      
      <div class="detail-item">
        <span class="label">Valor Líquido:</span>
        <span class="value highlight">{{ result.netValue | currency:'BRL':'symbol':'1.2-2' }}</span>
      </div>
    </div>
  </div>
</div>
